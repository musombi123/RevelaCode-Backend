name: RevelaCode current-admin role verification

on:
  push:
    branches: [main, "fix/revelaai-admin-role-verification"]
  pull_request:
    branches: [main]

jobs:
  verify-admin-role:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip pytest flask python-dotenv pymongo PyJWT
      - name: Compile the auth gate and regression tests
        run: python -m compileall -q backend/auth_gate.py backend/tests/test_revelaai_admin_auth.py
      - name: Run current-role authorization tests
        run: python -m pytest -q backend/tests/test_revelaai_admin_auth.py
