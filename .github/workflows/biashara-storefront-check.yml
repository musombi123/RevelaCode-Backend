name: Biashara storefront checks

on:
  push:
    branches:
      - biashara
      - feat/biashara-os-storefront-foundation
  pull_request:
    branches:
      - main
    paths:
      - "backend/jumuiya/biashara/**"
      - "backend/jumuiya/core/database.py"
      - "backend/tests/**"
      - "requirements.txt"
      - ".github/workflows/biashara-storefront-check.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Biashara validation tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install Flask pymongo pytest python-dotenv cryptography==50.0.2
      - name: Run Biashara storefront tests
        env:
          PYTHONPATH: backend
        run: python -m compileall -q backend/jumuiya/biashara backend/jumuiya/core && python -m pytest -q backend/tests/test_biashara_website.py backend/tests/test_schemas.py backend/tests/test_biashara_commerce_lifecycle.py backend/tests/test_biashara_outbox.py backend/tests/test_biashara_finance.py backend/tests/test_biashara_automation.py backend/tests/test_biashara_tenancy.py backend/tests/test_biashara_integrations.py backend/tests/test_biashara_service_authorization.py
