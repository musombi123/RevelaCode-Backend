name: Biashara storefront checks

on:
  push:
    branches:
      - feat/biashara-os-storefront-foundation
  pull_request:
    branches:
      - main
    paths:
      - "backend/jumuiya/biashara/**"
      - "backend/jumuiya/elimu/staff/**"
      - "backend/jumuiya/core/database.py"
      - "backend/tests/**"
      - "requirements.txt"
      - ".github/workflows/biashara-storefront-check.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Biashara validation tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install Flask pymongo pytest python-dotenv
      - name: Run Biashara storefront tests
        env:
          PYTHONPATH: backend
          MONGO_URI: mongodb://localhost:27017/biashara_test
        run: python -m compileall -q backend/jumuiya/biashara backend/jumuiya/elimu/staff backend/jumuiya/core && python -m pytest -q backend/tests/test_biashara_website.py backend/tests/test_schemas.py backend/tests/test_biashara_verification.py backend/tests/test_biashara_commerce_lifecycle.py backend/tests/test_biashara_membership_access.py backend/tests/test_staff_invitation_delivery.py
