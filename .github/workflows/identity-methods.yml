name: Identity methods backend checks

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/identity_methods.py"
      - "backend/google_oauth.py"
      - "main.py"
      - "requirements.txt"
      - "tests/test_identity_methods.py"
      - ".github/workflows/identity-methods.yml"
  push:
    branches:
      - feat/revelacode-identity-methods-20261125
    paths:
      - "backend/identity_methods.py"
      - "backend/google_oauth.py"
      - "main.py"
      - "requirements.txt"
      - "tests/test_identity_methods.py"
      - ".github/workflows/identity-methods.yml"

permissions:
  contents: read

jobs:
  identity-methods:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile identity modules
        run: python -m py_compile main.py backend/identity_methods.py backend/google_oauth.py
      - name: Run identity-method tests
        run: python -m pytest -q tests/test_identity_methods.py
