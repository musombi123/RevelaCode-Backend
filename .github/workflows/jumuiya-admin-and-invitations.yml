name: Jumuiya admin samples and staff invitation checks

on:
  push:
    branches: [main]
    paths:
      - "backend/jumuiya/sample_data.py"
      - "backend/jumuiya/platform_admin_routes.py"
      - "backend/jumuiya/biashara/contracts.py"
      - "backend/jumuiya/elimu/staff/services.py"
      - "backend/tests/test_staff_invitation_delivery.py"
      - "tests/test_jumuiya_sample_data.py"
      - "tests/test_biashara_invitation_contract.py"
      - ".github/workflows/jumuiya-admin-and-invitations.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/jumuiya/sample_data.py"
      - "backend/jumuiya/platform_admin_routes.py"
      - "backend/jumuiya/biashara/contracts.py"
      - "backend/jumuiya/elimu/staff/services.py"
      - "backend/tests/test_staff_invitation_delivery.py"
      - "tests/test_jumuiya_sample_data.py"
      - "tests/test_biashara_invitation_contract.py"
      - ".github/workflows/jumuiya-admin-and-invitations.yml"

permissions:
  contents: read

jobs:
  admin-and-invitation-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused backend test dependencies
        run: python -m pip install Flask pymongo pytest python-dotenv
      - name: Compile modified Jumuiya modules
        run: python -m py_compile backend/jumuiya/sample_data.py backend/jumuiya/platform_admin_routes.py backend/jumuiya/biashara/contracts.py backend/jumuiya/elimu/staff/services.py
      - name: Test scoped samples and staff invitation safeguards
        env:
          PYTHONPATH: .
          MONGO_URI: mongodb://127.0.0.1:27017/jumuiya_admin_invitation_test
        run: python -m pytest -q tests/test_jumuiya_sample_data.py tests/test_biashara_invitation_contract.py backend/tests/test_staff_invitation_delivery.py
