name: Jumuiya deep health validation

on:
  push:
    branches: [main]
    paths:
      - "backend/jumuiya/core/health.py"
      - "backend/jumuiya/elimu/routes.py"
      - "backend/jumuiya/shamba/routes.py"
      - "backend/jumuiya/biashara/routes.py"
      - "backend/jumuiya/community/routes.py"
      - "backend/jumuiya/faith/missionpulse/routes.py"
      - "tests/test_jumuiya_health.py"
      - ".github/workflows/jumuiya-deep-health.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/jumuiya/core/health.py"
      - "backend/jumuiya/elimu/routes.py"
      - "backend/jumuiya/shamba/routes.py"
      - "backend/jumuiya/biashara/routes.py"
      - "backend/jumuiya/community/routes.py"
      - "backend/jumuiya/faith/missionpulse/routes.py"
      - "tests/test_jumuiya_health.py"
      - ".github/workflows/jumuiya-deep-health.yml"

permissions:
  contents: read

jobs:
  health-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install pytest pymongo python-dotenv
      - name: Compile hub health routes
        run: python -m py_compile backend/jumuiya/core/health.py backend/jumuiya/elimu/routes.py backend/jumuiya/shamba/routes.py backend/jumuiya/biashara/routes.py backend/jumuiya/community/routes.py backend/jumuiya/faith/missionpulse/routes.py
      - name: Test read-only dependency evidence
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_jumuiya_health.py