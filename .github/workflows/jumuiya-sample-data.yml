name: Jumuiya sample data validation

on:
  push:
    branches: [main]
    paths:
      - "backend/jumuiya/sample_data.py"
      - "backend/jumuiya/platform_admin_routes.py"
      - "backend/jumuiya/core/database.py"
      - "backend/jumuiya/integration/register.py"
      - "tests/test_jumuiya_sample_data.py"
      - ".github/workflows/jumuiya-sample-data.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/jumuiya/sample_data.py"
      - "backend/jumuiya/platform_admin_routes.py"
      - "backend/jumuiya/core/database.py"
      - "backend/jumuiya/integration/register.py"
      - "tests/test_jumuiya_sample_data.py"
      - ".github/workflows/jumuiya-sample-data.yml"

permissions:
  contents: read

jobs:
  sample-data-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused backend test dependencies
        run: python -m pip install Flask pymongo pytest python-dotenv
      - name: Compile Jumuiya sample data modules
        run: python -m py_compile backend/jumuiya/sample_data.py backend/jumuiya/platform_admin_routes.py backend/jumuiya/core/database.py backend/jumuiya/integration/register.py
      - name: Test fixture coverage, idempotency, and admin access
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_jumuiya_sample_data.py
