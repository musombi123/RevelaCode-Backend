name: MissionPulse backend validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/jumuiya/faith/missionpulse/**"
      - "backend/jumuiya/integration/register.py"
      - ".github/workflows/missionpulse-validation.yml"

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile MissionPulse modules
        run: |
          python -m py_compile backend/jumuiya/faith/missionpulse/routes.py
          python -m py_compile backend/jumuiya/integration/register.py
