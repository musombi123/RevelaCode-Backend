name: RevelaCode account documents backend

on:
  push:
    branches:
      - main
      - feat/usect-foundry-fastapi-native
      - fix/elimu-learning-route-integration
  pull_request:
    branches:
      - main
      - feat/usect-foundry-fastapi-native

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-only-jwt-secret-for-ci
      MONGO_URI: mongodb://127.0.0.1:27017/revelacode_test
      REVELACODE_CERTIFICATE_SIGNING_KEY: test-only-certificate-key
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(0)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted backend test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile authentication, account document, Community, Elimu, and Shamba modules
        run: >-
          python -m py_compile
          main.py
          backend/auth_gate.py
          backend/account_documents.py
          backend/routes/study_routes.py
          backend/jumuiya/shamba/models.py
          backend/jumuiya/shamba/schemas.py
          backend/jumuiya/shamba/services.py
          backend/jumuiya/shamba/routes.py
          backend/jumuiya/shamba/trust_routes.py
          backend/jumuiya/community/services.py
          backend/jumuiya/community/messaging.py
          backend/jumuiya/community/routes.py
          backend/jumuiya/elimu/routes.py
          backend/jumuiya/elimu/finance_routes.py
          backend/jumuiya/elimu/intelligence_routes.py
      - name: Verify account document, Elimu, and Community route registration contracts
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def decorated_routes(path, accepted_decorators):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
              routes = set()
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  for decorator in node.decorator_list:
                      if not isinstance(decorator, ast.Call) or not isinstance(decorator.func, ast.Attribute):
                          continue
                      name = decorator.func.attr
                      if name not in accepted_decorators or not decorator.args or not isinstance(decorator.args[0], ast.Constant):
                          continue
                      route = decorator.args[0].value
                      if name == "route":
                          methods = {"GET"}
                          for keyword in decorator.keywords:
                              if keyword.arg == "methods" and isinstance(keyword.value, (ast.List, ast.Tuple)):
                                  methods = {elt.value for elt in keyword.value.elts if isinstance(elt, ast.Constant)}
                      else:
                          methods = {name.upper()}
                      routes.update((method, route, node.name) for method in methods)
              return routes

          account_routes = decorated_routes("backend/account_documents.py", {"route"})
          expected_account = {
              ("GET", "/api/accounts/profile/download", "download_account_profile"),
              ("POST", "/api/accounts/certificates", "issue_account_certificate"),
              ("GET", "/api/accounts/certificates/<certificate_id>/download", "download_account_certificate"),
              ("POST", "/api/accounts/certificates/<certificate_id>/revoke", "revoke_account_certificate"),
              ("GET", "/api/verify/certificate/<certificate_id>", "verify_account_certificate"),
          }
          missing_account = expected_account - account_routes
          assert not missing_account, f"Missing account-document routes: {sorted(missing_account)}"

          elimu_routes = decorated_routes("backend/routes/study_routes.py", {"get", "post"})
          expected_elimu = {
              ("GET", "/elimu/hubs", "elimu_learning_list_hubs"),
              ("GET", "/elimu/hubs/<hub_id>", "elimu_learning_get_hub"),
              ("GET", "/elimu/progress", "elimu_learning_get_progress"),
              ("POST", "/elimu/progress", "elimu_learning_save_progress"),
              ("POST", "/elimu/certificates/generate", "elimu_learning_generate_certificate"),
              ("GET", "/elimu/certificates/<certificate_id>", "elimu_learning_download_certificate"),
              ("GET", "/elimu/certificates/verify/<certificate_id>", "elimu_learning_verify_certificate"),
          }
          missing_elimu = expected_elimu - elimu_routes
          assert not missing_elimu, f"Missing Elimu learning routes: {sorted(missing_elimu)}"

          community_routes = decorated_routes("backend/jumuiya/community/routes.py", {"get", "post", "patch"})
          expected_community = {
              ("GET", "/matters", "get_matters"),
              ("POST", "/matters", "create_matter"),
              ("GET", "/matters/<matter_id>/messages", "get_matter_messages"),
              ("POST", "/matters/<matter_id>/messages", "send_matter_message"),
              ("PATCH", "/matters/<matter_id>/status", "update_matter_status"),
          }
          missing_community = expected_community - community_routes
          assert not missing_community, f"Missing Community messaging routes: {sorted(missing_community)}"

          main_text = Path("main.py").read_text(encoding="utf-8-sig")
          assert "from backend.routes.study_routes import study_bp" in main_text, "Existing study blueprint is not imported by main.py"
          assert 'url_prefix="/api/study"' in main_text, "Existing study blueprint is not registered under /api/study"
          print(f"Verified {len(expected_account)} account-document routes, {len(expected_elimu)} Elimu learning routes, and {len(expected_community)} Community messaging routes.")
          PY
      - name: Run Community comment route contract tests
        run: python -m pytest -q tests/test_community_comments_routes.py
      - name: Run public Community share route tests
        run: python -m pytest -q tests/test_community_public_share_routes.py
      - name: Run Shamba farmer verification regression tests
        run: python -m pytest -q tests/test_shamba_farmer_verification.py tests/test_shamba_marketplace_eligibility.py
      - name: Run Elimu progress and certificate tests
        run: python -m pytest -q tests/test_elimu_learning_routes.py tests/test_account_documents.py
      - name: Run Elimu intelligence and M-Pesa guard tests
        run: python -m pytest -q tests/test_elimu_intelligence_and_mpesa.py


