name: Jumuiya Revenue Engine validation

on:
  push:
    branches: [main]
    paths:
      - "backend/revenue/**"
      - "tests/test_revenue_entitlements_and_mpesa.py"
      - ".github/workflows/revenue-engine-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/revenue/**"
      - "tests/test_revenue_entitlements_and_mpesa.py"
      - ".github/workflows/revenue-engine-validation.yml"

jobs:
  revenue-engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_SECRET: test-only-revenue-secret
      MONGO_URI: mongodb://127.0.0.1:27017/revelacode_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install revenue-engine test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest Flask python-dotenv pymongo PyJWT requests resend
      - name: Compile revenue modules and regression tests
        run: python -m compileall -q backend/revenue tests/test_revenue_entitlements_and_mpesa.py
      - name: Run entitlement, trial, plan, checkout, and reconciliation tests
        run: python -m pytest -q tests/test_revenue_entitlements_and_mpesa.py
