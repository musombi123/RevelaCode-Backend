name: Scalability foundation checks

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "backend/db.py"
      - "backend/background_worker.py"
      - "backend/background_jobs.py"
      - "backend/security_ip_guard.py"
      - "backend/security/headers.py"
      - "backend/security/origin_cache.py"
      - "backend/observability/request_metrics.py"
      - "backend/tests/test_process_lifecycle.py"
      - "backend/tests/test_security_headers.py"
      - "backend/tests/test_origin_cache.py"
      - "backend/tests/test_ip_guard.py"
      - "backend/tests/test_request_metrics.py"
      - "gunicorn.conf.py"
      - "render.yaml"
      - ".github/workflows/scalability-foundation.yml"
  push:
    branches: [engineering/scalability-completion]
    paths:
      - "main.py"
      - "backend/db.py"
      - "backend/background_worker.py"
      - "backend/background_jobs.py"
      - "backend/security_ip_guard.py"
      - "backend/security/headers.py"
      - "backend/security/origin_cache.py"
      - "backend/tests/test_process_lifecycle.py"
      - "backend/tests/test_security_headers.py"
      - "backend/tests/test_origin_cache.py"
      - "backend/tests/test_ip_guard.py"
      - "gunicorn.conf.py"
      - "render.yaml"
      - ".github/workflows/scalability-foundation.yml"

permissions:
  contents: read

jobs:
  process-lifecycle:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/revelacode_scalability_test
      MONGO_DB_NAME: revelacode_scalability_test
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install pytest flask python-dotenv pymongo
      - name: Compile changed Python modules
        run: python -m py_compile main.py backend/db.py backend/background_worker.py backend/background_jobs.py backend/security_ip_guard.py backend/security/headers.py backend/security/origin_cache.py backend/observability/request_metrics.py gunicorn.conf.py backend/tests/test_process_lifecycle.py backend/tests/test_security_headers.py backend/tests/test_origin_cache.py backend/tests/test_ip_guard.py backend/tests/test_request_metrics.py
      - name: Verify worker lifecycle, security headers, origin cache and IP protection
        run: python -m pytest -q backend/tests/test_process_lifecycle.py backend/tests/test_security_headers.py backend/tests/test_origin_cache.py backend/tests/test_ip_guard.py backend/tests/test_request_metrics.py
