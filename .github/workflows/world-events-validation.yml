name: World Events backend validation

on:
  push:
    branches: [main]
    paths:
      - "backend/jumuiya/community/world_events_routes.py"
      - "backend/jumuiya/integration/register.py"
      - ".github/workflows/world-events-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/jumuiya/community/world_events_routes.py"
      - "backend/jumuiya/integration/register.py"
      - ".github/workflows/world-events-validation.yml"

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile World Events and Jumuiya registration
        run: |
          python -m py_compile backend/jumuiya/community/world_events_routes.py
          python -m py_compile backend/jumuiya/integration/register.py
