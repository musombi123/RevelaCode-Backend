services:
  - type: web
    name: revelacode-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
      # Explicit allow-list for production web, Tauri Windows and Capacitor Android clients.
      - key: FRONTEND_ORIGINS
        value: "https://revelacode.co.ke,https://www.revelacode.co.ke,https://revelacode-frontend.onrender.com,http://tauri.localhost,https://localhost,http://localhost,http://localhost:5173,http://127.0.0.1:5173"
      # Backend-originated AI tasks use the public RevelaAI /ai contract.
      - key: REVELA_AI_URL
        value: "https://revelaai.onrender.com/ai"
      # Must match RevelaAI's REVELAAI_SERVICE_KEY for the protected AI context gateway.
      - key: REVELAAI_SERVICE_KEY
        sync: false

  - type: cron
    name: revelacode-market-data-refresh
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.jumuiya.biashara.intelligence.jobs.update_market_data
    schedule: "0 */6 * * *"

  - type: cron
    name: revelacode-elimu-student-lifecycle
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.jumuiya.elimu.lifecycle_worker
    schedule: "17 2 * * *"

  - type: cron
    name: revelacode-elimu-teacher-reminders
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.jumuiya.elimu.teacher_reminders
    schedule: "*/5 * * * *"
