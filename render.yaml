services:
  - type: web
    name: revelacode-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000

  - type: cron
    name: revelacode-market-data-refresh
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.jumuiya.biashara.intelligence.jobs.update_market_data
    schedule: "0 */6 * * *"
